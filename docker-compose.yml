services:
  mysql:
    image: mysql:8.4
    container_name: employee-mysql
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD} #it is the password set for the mysql  root user 
      MYSQL_DATABASE: ${MYSQL_DATABASE}
    volumes:
      - mysql_data:var/lib/mysql
      - ./database/init.sql:/docker-entrypoint-initdb.d/init.sql:ro
    ports:
      - "3306:3306"
  backend:
    build: 
      context: ./backend
    container_name: employee-backend
    environment:
      DB_HOST: mysql
      DB_USER: ${MYSQL_USER}
      DB_PASSWORD: ${MYSQL_PASSWORD}
      DB_NAME: ${MYSQL_DATABASE}
    depends_on: 
      - mysql
    ports:
      - "8000:8000"
  frontend:
    build: 
      context: ./frontend
    container_name: employee-frontend
    depends_on: 
      - backend
    ports: 
      - "8080:8080"
volumes:
  mysql_data:
